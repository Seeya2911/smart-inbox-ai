name: Build Manus corpus artifact

on:
  workflow_dispatch:
    inputs:
      enron_rows:
        description: "Enron rows"
        required: true
        default: "4000"
      spam_rows:
        description: "SpamAssassin rows"
        required: true
        default: "3000"
      phishing_rows:
        description: "Retained phishing-corpus rows"
        required: true
        default: "3000"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install exporter and Enron dependencies
        run: python -m pip install --disable-pip-version-check openpyxl pyarrow

      - name: Create workspace
        run: mkdir -p data/manus_build

      - name: Download Enron
        run: >-
          python -m ml.email_dataset_ingest
          --source enron
          --max-rows "${{ inputs.enron_rows }}"
          --batch-size 100
          --output data/manus_build/enron.jsonl

      - name: Download SpamAssassin
        run: >-
          python -m ml.email_dataset_ingest
          --source spam_corpus
          --max-rows "${{ inputs.spam_rows }}"
          --batch-size 100
          --output data/manus_build/spam_corpus.jsonl

      - name: Download retained phishing corpora
        run: >-
          python -m ml.phishing_parquet_ingest
          --max-rows "${{ inputs.phishing_rows }}"
          --output data/manus_build/phishing_corpus.jsonl

      - name: Export Manus workbook
        # export_manus_dataset.main() calls validate_workbook() internally and
        # exits non-zero if the generated XLSX is corrupt. The artifact is
        # therefore never uploaded when the workbook fails self-validation.
        run: >-
          python -m ml.export_manus_dataset
          data/manus_build/enron.jsonl
          data/manus_build/spam_corpus.jsonl
          data/manus_build/phishing_corpus.jsonl
          --output data/manus_build/smart_inbox_manus_corpus.xlsx
          --manifest data/manus_build/smart_inbox_manus_corpus.manifest.json

      - name: Validate workbook schema and integrity
        # This step performs a deep, independent validation of the generated
        # workbook using ml.xlsx_utils.validate_workbook().  It is intentionally
        # separate from the self-validation inside the exporter so that any future
        # change to the exporter cannot silently bypass the check.
        run: |
          python - <<'PY'
          import json
          import sys
          import zipfile
          from pathlib import Path

          from ml.xlsx_utils import validate_workbook, EXCEL_MAX_CELL_CHARS

          root = Path("data/manus_build")
          xlsx_path = root / "smart_inbox_manus_corpus.xlsx"
          manifest_path = root / "smart_inbox_manus_corpus.manifest.json"

          # 1. Independent validate_workbook() check
          result = validate_workbook(xlsx_path)
          if not result["valid"]:
              print("XLSX VALIDATION FAILED:", file=sys.stderr)
              for err in result["errors"]:
                  print(f"  ERROR: {err}", file=sys.stderr)
              sys.exit(1)

          # 2. Cross-check manifest row count
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          expected_rows = manifest["output_rows"]
          actual_rows = result["row_count"]
          if expected_rows != actual_rows:
              print(
                  f"Row count mismatch: manifest says {expected_rows}, "
                  f"workbook has {actual_rows}",
                  file=sys.stderr,
              )
              sys.exit(1)

          # 3. Source values sanity check
          known_sources = {"enron", "spam_corpus", "phishing_corpus"}
          unknown = {s for s in result["source_counts"] if s not in known_sources}
          if unknown:
              print(f"Unknown source values found: {unknown}", file=sys.stderr)
              sys.exit(1)

          # 4. Every expected source must have at least one row
          for expected_source in known_sources:
              if expected_source not in result["source_counts"]:
                  print(f"Missing expected source: {expected_source}", file=sys.stderr)
                  sys.exit(1)

          # 5. Report
          print("Workbook validation PASSED")
          print(json.dumps({
              "row_count": result["row_count"],
              "source_counts": result["source_counts"],
              "truncated_cells": result["truncated_cells"],
              "excel_max_cell_chars": EXCEL_MAX_CELL_CHARS,
          }, indent=2))
          PY

      - name: Upload Manus corpus
        uses: actions/upload-artifact@v4
        with:
          name: smart-inbox-manus-corpus
          path: data/manus_build/smart_inbox_manus_corpus.*
          if-no-files-found: error
          retention-days: 14
